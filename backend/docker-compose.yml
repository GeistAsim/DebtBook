services:
  fastapi-app:
    build: .
    container_name: debtbook
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - RELOAD=True
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    restart: unless-stopped
